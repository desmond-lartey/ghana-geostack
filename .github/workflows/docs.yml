# Publishes the documentation site to GitHub Pages.
#
# Pages must be set to "GitHub Actions" as its source, under
# Settings -> Pages -> Build and deployment. The environment protection rules
# allow deployment from the default branch only, so this runs on main.

name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/sync_docs.py"
      - "skills/**"
      - "LICENSE-DATA.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A queued run supersedes an older one rather than
# cancelling the run in progress, so a half-published site is never left.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git revision dates for the page footers

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2-dev libfreetype6-dev libffi-dev \
                                      libjpeg-dev libpng-dev libz-dev
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Sync generated pages
        run: python scripts/sync_docs.py

      - name: Build
        run: mkdocs build --strict

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
