name: Documentation

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# One deployment at a time; a queued run supersedes a pending one rather than
# cancelling a deployment already in progress.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # git-revision-date plugins need full history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install Material for MkDocs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev \
                                  libjpeg-dev libpng-dev libz-dev
          pip install -r requirements-docs.txt

      - name: Sync canonical pages into the docs tree
        run: python scripts/sync_docs.py

      - name: Build
        # --strict fails on a broken internal link rather than shipping one.
        run: mkdocs build --strict

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
