# Checks that run on every push and pull request.
#
# Deliberately light: style, the unit tests that need no database, and a
# structural check on the web viewer. The database-backed quality control runs
# against a live PostGIS instance, which belongs in `make qc` rather than here.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pyyaml

      # Through the Makefile deliberately, so "lint" has one definition. It
      # previously had two: the Makefile dropped the formatter check with a
      # documented reason, CI kept enforcing it, and main went red on a file
      # nobody had touched.
      - name: Lint
        run: make lint

      - name: Test
        run: pytest -q tests/

  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      # Every dataset carries a licence and an attribution string. The export
      # step refuses to publish without them, so a missing one should fail here
      # rather than three steps into someone's first pipeline run.
      - name: Every dataset is attributed
        run: |
          python - <<'PY'
          import sys, yaml, pathlib

          catalog = yaml.safe_load(pathlib.Path("config/catalog.yml").read_text())
          missing = [
              d.get("id", "<no id>")
              for d in catalog.get("datasets", [])
              if not d.get("licence") or not d.get("attribution")
          ]
          if missing:
              sys.exit("Missing licence or attribution: " + ", ".join(missing))
          print(f"{len(catalog.get('datasets', []))} datasets, all attributed")
          PY

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The viewer is one self-contained file. A syntax error in it is a blank
      # page in production, so the script block is parsed here.
      - name: The viewer parses
        run: |
          node - <<'JS'
          const fs = require("fs");
          const { execFileSync } = require("child_process");

          const html = fs.readFileSync("web/index.html", "utf8");
          const blocks = [...html.matchAll(/<script(?![^>]*src=)[^>]*>([\s\S]*?)<\/script>/g)];
          if (!blocks.length) { console.error("No inline script found"); process.exit(1); }

          // The viewer's script is an ES module, so it is checked as one:
          // `new Function` rejects a top-level import.
          blocks.forEach((block, i) => {
            const file = `/tmp/viewer-block-${i + 1}.mjs`;
            fs.writeFileSync(file, block[1]);
            try {
              execFileSync("node", ["--check", file], { stdio: "pipe" });
            } catch (err) {
              console.error(`Script block ${i + 1} failed to parse:`);
              console.error(err.stderr.toString());
              process.exit(1);
            }
          });
          console.log(`${blocks.length} script block(s) parse`);
          JS

      - name: The site builds
        run: |
          pip install pyyaml
          python scripts/build_web.py
          test -f public/index.html

      # Parsing is not running. A constant referenced before its declaration
      # parses perfectly and throws on evaluation, taking the page with it —
      # which is how a blank viewer reached production once already. This
      # loads the built page in a browser with the map library stubbed, so the
      # module actually executes.
      - name: The viewer runs
        run: |
          npm install --no-save playwright@1.49
          npx playwright install --with-deps chromium
          node tests/smoke_viewer.cjs
