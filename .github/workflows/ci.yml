name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check pipelines/
      - run: ruff format --check pipelines/

  config:
    # Catches the mistakes that are cheap to make and expensive to find:
    # a source added without a licence, or ghana.yml and the SQL constants
    # drifting apart.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest
      - run: pytest tests/test_config.py -v

  database:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: ghana
          POSTGRES_USER: ghana
          POSTGRES_PASSWORD: ghana
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ghana"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: ghana
      PGUSER: ghana
      PGPASSWORD: ghana
    steps:
      - uses: actions/checkout@v4
      - name: Install the PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Extensions
        run: psql -h localhost -U ghana -d ghana -f docker/initdb/00_extensions.sql
      - name: Migrations
        run: |
          for f in db/migrations/*.sql; do
            echo "--- $f"
            psql -h localhost -U ghana -d ghana -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Migrations are idempotent
        # Running them twice must be a no-op. A migration that only works on an
        # empty database is a migration that will fail on someone's laptop.
        run: |
          for f in db/migrations/*.sql; do
            psql -h localhost -U ghana -d ghana -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Ghana helper functions behave
        run: psql -h localhost -U ghana -d ghana -v ON_ERROR_STOP=1 -f tests/test_functions.sql
