# Documentation site, built with Material for MkDocs and published to
# GitHub Pages by .github/workflows/docs.yml
#
# Some pages are generated by scripts/sync_docs.py from the canonical file
# elsewhere in the repository, so the skill reference and the licensing terms
# have exactly one source of truth. Run `make docs` before `mkdocs serve`.

site_name: Ghana GeoStack
site_description: >-
  Open spatial data platform for Ghana. PostGIS, DuckDB, GeoParquet and vector
  tiles, with 16 regions and 260 districts included.
site_author: Desmond Lartey
site_url: https://desmond-lartey.github.io/ghana-geostack/

repo_url: https://github.com/desmond-lartey/ghana-geostack
repo_name: desmond-lartey/ghana-geostack

copyright: >-
  Code released under the MIT licence. Data remains under the licence of its
  producer — see <a href="project/licensing/">Data licensing</a>.

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  custom_dir: docs/overrides

  font:
    text: Roboto
    code: Roboto Mono

  logo: assets/logo.svg
  favicon: assets/favicon.svg

  icon:
    repo: fontawesome/brands/github

  # Dark first, so it is what a visitor sees by default.
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

  features:
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/desmond-lartey/ghana-geostack
      name: Source on GitHub
    - icon: material/map
      link: https://ghana-geostack.vercel.app
      name: Live map
  generator: true

plugins:
  - search:
      lang: en
  - tags

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md
  - Quick start: quickstart.md
  - Administrative boundaries: boundaries.md
  - Architecture: architecture.md
  - Querying the data: querying.md
  - Earth observation catalogue: catalog.md
  - Earth Engine in the browser: earth-engine.md
  - Population, worked through: population.md
  - Data catalogue: skill/data-catalog.md
  - Coordinate systems: skill/crs.md
  - Agent skill: skill/index.md
  - PostGIS reference: skill/postgis.md
  - DuckDB reference: skill/duckdb.md
  - Map styling: skill/map-styling.md
  - Deployment: deployment.md
  - Contributing: project/contributing.md
  - Working with agents: project/agents.md
  - Data licensing: project/licensing.md
  - Roadmap: project/roadmap.md
  - Migration notes: migration-notes.md

watch:
  - skills
  - README.md
