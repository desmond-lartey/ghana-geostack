# Documentation site, built with Material for MkDocs and published to
# GitHub Pages by .github/workflows/docs.yml
#
# Some pages are generated by scripts/sync_docs.py from the canonical file
# elsewhere in the repository, so the skill reference and the licensing terms
# have exactly one source of truth. Run `make docs` before `mkdocs serve`.

site_name: Ghana GeoStack
site_description: >-
  Open spatial data platform for Ghana. PostGIS, DuckDB, GeoParquet and vector
  tiles, with 16 regions and 260 districts included.
site_author: Ghana GeoStack contributors
site_url: https://YOUR-ORG.github.io/ghana-geostack/

repo_url: https://github.com/YOUR-ORG/ghana-geostack
repo_name: YOUR-ORG/ghana-geostack
edit_uri: edit/main/docs/

copyright: >-
  Code released under the MIT licence. Data remains under the licence of its
  producer — see <a href="project/licensing/">Data licensing</a>.

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  custom_dir: docs/overrides

  font:
    text: IBM Plex Sans
    code: IBM Plex Mono

  icon:
    repo: fontawesome/brands/github
    logo: material/map-marker-radius

  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system theme

    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/YOUR-ORG/ghana-geostack
      name: Source on GitHub
    - icon: material/map
      link: https://ghana-geostack.vercel.app
      name: Live map
  generator: true

plugins:
  - search:
      lang: en
  - tags

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md

  - Getting started:
      - Quick start: quickstart.md
      - Deployment: deployment.md

  - Data:
      - Administrative boundaries: boundaries.md
      - Catalogue: skill/data-catalog.md
      - Coordinate systems: skill/crs.md

  - Platform:
      - Architecture: architecture.md
      - Migration notes: migration-notes.md

  - Agent skill:
      - Overview: skill/index.md
      - PostGIS: skill/postgis.md
      - DuckDB: skill/duckdb.md
      - Map styling: skill/map-styling.md

  - Project:
      - Contributing: project/contributing.md
      - Working with agents: project/agents.md
      - Roadmap: project/roadmap.md
      - Data licensing: project/licensing.md

watch:
  - skills
  - README.md
